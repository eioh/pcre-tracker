name: Deploy to Cloudflare Workers

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "deploy-workers"
  # D1 適用後から Worker 公開までの途中で実行を中断しない。
  cancel-in-progress: false

jobs:
  deploy:
    # workflow_dispatch で main 以外の ref を選んでも本番を変更しない。
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # PR・手動確認と同じ順序で、生成物・型・テスト・本番ビルドを検証する。
      - name: Verify
        run: npm run verify
        env:
          # Workers テストが一時ファイルを短いパスへ作成できるよう Linux 上だけ指定する。
          TMPDIR: /tmp

      # デプロイ前に D1 マイグレーションを本番 DB に適用する（未適用分のみが実行される）。
      # DB 未作成（database_id がプレースホルダ）のうちは deploy と同様に実行不能だが、
      # ユーザー作業（D1 作成・secrets 登録）完了後に一体で動く構成にしている。
      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply pcre-tracker-db --remote

      # ビルド直後に同一 job 内でデプロイする（dist・wrangler.jsonc・Worker ソースが揃った状態を保つため）。
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # vite build が dist/ に成果物と生成 wrangler.json を出力済みのため、deploy のみ実行する。
          command: deploy
