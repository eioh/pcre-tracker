name: Deploy to Cloudflare Workers

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "deploy-workers"
  # D1 適用後から Worker 公開までの途中で実行を中断しない。
  cancel-in-progress: false

jobs:
  # 検証と本番ビルドを行う。Cloudflare の Secrets はこのジョブに渡さない。
  build:
    # workflow_dispatch で main 以外の ref を選んでも本番を変更しない。
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # PR・手動確認と同じ順序で、生成物・型・テスト・本番ビルド・デプロイ用設定を検証する。
      - name: Verify
        run: npm run verify
        env:
          # Workers テストが一時ファイルを短いパスへ作成できるよう Linux 上だけ指定する。
          TMPDIR: /tmp

      # ローカル開発用の変数ファイルは成果物に含めない（CI では通常存在しないが念のため消す）。
      - name: Remove local dev vars from build output
        run: rm -f dist/pcre_tracker/.dev.vars

      # dist/client/.assetsignore（ドットファイル）を含めるため include-hidden-files を有効にする。
      - name: Upload build output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # build ジョブの成果物を公開する。Secrets は GitHub Environment `production` から、このジョブにだけ渡す。
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
    steps:
      # D1 マイグレーション・lockfile・検証スクリプトをリポジトリから取得する。
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Secrets を扱うジョブでは依存キャッシュを使わない。
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          # package.json に packageManager が追加されても自動キャッシュを有効にしない。
          package-manager-cache: false

      # lockfile に固定された wrangler を入れる。依存パッケージのインストールスクリプトは実行しない。
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Download build output
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      # wrangler を呼ぶ前に、成果物の wrangler.json をリポジトリの wrangler.jsonc と照合する。
      - name: Verify deploy config
        run: node scripts/verify-deploy-config.mjs

      # デプロイ前に D1 マイグレーションを本番 DB に適用する（未適用分のみが実行される）。
      # --config で成果物の設定を明示する。migrations_dir は設定ファイルからの相対パスで <repo>/migrations に解決される。
      - name: Apply D1 migrations
        run: npx --no-install wrangler d1 migrations apply pcre-tracker-db --remote --config dist/pcre_tracker/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # vite build が出力した Worker・静的アセット・生成 wrangler.json をそのまま公開する。
      - name: Deploy to Cloudflare Workers
        run: npx --no-install wrangler deploy --config dist/pcre_tracker/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
